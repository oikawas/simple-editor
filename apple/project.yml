# Xcode project for the macOS and iOS apps. Generate it with XcodeGen:
#   brew install xcodegen
#   DEVELOPMENT_TEAM=<your team ID> xcodegen generate
name: SimpleEditor
options:
  bundleIdPrefix: io.github.oikawas
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: io.github.oikawas.SimpleEditor
    PRODUCT_NAME: Simple Editor
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Simple Editor
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: 自宅サーバーと同期するために、ローカルネットワーク上のサーバーに接続します。
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  SimpleEditorCore:
    path: SimpleEditorCore
targets:
  SimpleEditor-iOS:
    type: application
    platform: iOS
    # A shared scheme, so it is listed even when Xcode does not create one.
    scheme: {}
    sources:
      - path: App
        excludes: [macOS.entitlements]
    dependencies:
      - package: SimpleEditorCore
        product: SimpleEditorModel
      - package: SimpleEditorCore
        product: SimpleEditorCore
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  SimpleEditor-macOS:
    type: application
    platform: macOS
    scheme: {}
    sources:
      - path: App
        excludes: [macOS.entitlements]
    dependencies:
      - package: SimpleEditorCore
        product: SimpleEditorModel
      - package: SimpleEditorCore
        product: SimpleEditorCore
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: App/macOS.entitlements
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ENABLE_HARDENED_RUNTIME: YES
