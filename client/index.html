<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Simple Editor</title>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <header class="bar">
          <button id="new-note" class="primary" title="新規ノート">＋ 新規</button>
          <span id="status" class="status" title="同期状態"></span>
          <button id="open-settings" title="設定">⚙︎</button>
        </header>
        <input id="search" type="search" placeholder="検索" autocomplete="off" />
        <nav id="tag-filter"></nav>
        <ul id="note-list"></ul>
      </aside>
      <main id="editor-pane">
        <header class="bar">
          <button id="back" class="mobile-only" title="一覧へ">‹ 一覧</button>
          <div id="tags" class="tags"></div>
          <button id="export-note" title="テキストとして書き出し">⇩ .txt</button>
          <button id="trash-note" title="ゴミ箱へ">🗑</button>
        </header>
        <div id="dates" class="dates"></div>
        <div id="editor"></div>
        <div id="empty" class="empty">ノートを選択するか、新規作成してください</div>
      </main>
    </div>

    <dialog id="settings">
      <form method="dialog">
        <h2>設定</h2>
        <label>サーバー URL<input name="serverUrl" type="url" placeholder="https://notes.example.com" /></label>
        <label>アクセストークン<input name="token" type="password" autocomplete="current-password" /></label>
        <label>この端末の名前<input name="deviceName" placeholder="Mac" /></label>
        <p class="hint">トークンはサーバーの AUTH_TOKEN と同じ値です。</p>
        <div class="row">
          <button type="button" id="export-all">すべて書き出し (.zip)</button>
          <span class="spacer"></span>
          <button value="cancel">キャンセル</button>
          <button value="save" class="primary">保存</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
