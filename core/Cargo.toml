[package]
name = "simple-editor-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Sync, storage, and server API shared by the native Simple Editor apps"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "simple_editor_core"

[dependencies]
yrs = { version = "0.28", features = ["sync"] }
uniffi = { version = "0.32", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "__rustls-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
uniffi = { version = "0.32", features = ["build"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]
