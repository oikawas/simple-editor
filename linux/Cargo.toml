[package]
name = "simple-editor-gtk"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Simple Editor for Linux (GTK 4 / libadwaita)"

[dependencies]
simple-editor-core = { path = "../core" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
async-channel = "2"
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
